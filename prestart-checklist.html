<body>
<div id="ps-root">
  <div style="max-width:600px;margin:60px auto;text-align:center;color:#5a6472;font-family:sans-serif;">
    Loading checklist...
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/prestart-engine.js"></script>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const formId = params.get("form");
    const root = document.getElementById("ps-root");

    if (!formId) {
      root.innerHTML =
        '<div style="max-width:600px;margin:60px auto;text-align:center;color:#c5221f;font-family:sans-serif;">' +
        "No checklist specified. Open this page with a link like <code>prestart-checklist.html?form=truck-semi-trailer</code>, or go to " +
        '<a href="index.html">the form index</a>.</div>';
      return;
    }

    const script = document.createElement("script");
    script.src = "data/prestart-" + formId + ".js";
    script.onload = function () {
      if (window.PRESTART_DATA) {
        PrestartEngine.init(window.PRESTART_DATA);
      } else {
        root.innerHTML =
          '<div style="max-width:600px;margin:60px auto;text-align:center;color:#c5221f;font-family:sans-serif;">' +
          "This checklist's data file did not load correctly.</div>";
      }
    };
    script.onerror = function () {
      root.innerHTML =
        '<div style="max-width:600px;margin:60px auto;text-align:center;color:#c5221f;font-family:sans-serif;">' +
        'Could not find a checklist named "' + formId + '". Check the link and try again, or go to ' +
        '<a href="index.html">the form index</a>.</div>';
    };
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
