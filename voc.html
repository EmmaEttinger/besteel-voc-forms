<body>
<div id="voc-root">
  <div style="max-width:600px;margin:60px auto;text-align:center;color:#5a6472;font-family:sans-serif;">
    Loading VOC form...
  </div>
</div>

<!-- jsPDF: generates a real PDF client-side (branded, text-searchable)
     of the completed VOC so a copy can be auto-attached to the SharePoint
     item on submit — the audit-ready signed/dated record. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/voc-engine.js"></script>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const formId = params.get("form");
    const root = document.getElementById("voc-root");

    if (!formId) {
      root.innerHTML =
        '<div style="max-width:600px;margin:60px auto;text-align:center;color:#c5221f;font-family:sans-serif;">' +
        "No VOC specified. Open this page with a link like <code>voc.html?form=angle-grinder</code>, or go to " +
        '<a href="index.html">the VOC index</a>.</div>';
      return;
    }

    const script = document.createElement("script");
    script.src = "data/" + formId + ".js";
    script.onload = function () {
      if (window.VOC_DATA) {
        VOCEngine.init(window.VOC_DATA);
      } else {
        root.innerHTML =
          '<div style="max-width:600px;margin:60px auto;text-align:center;color:#c5221f;font-family:sans-serif;">' +
          "This VOC's data file did not load correctly.</div>";
      }
    };
    script.onerror = function () {
      root.innerHTML =
        '<div style="max-width:600px;margin:60px auto;text-align:center;color:#c5221f;font-family:sans-serif;">' +
        'Could not find a VOC named "' + formId + '". Check the link and try again, or go to ' +
        '<a href="index.html">the VOC index</a>.</div>';
    };
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
